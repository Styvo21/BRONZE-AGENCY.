<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRONZE MONEY AGENCIES</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2}
header{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;}
#balance{background:orange;padding:5px 10px;border-radius:5px;cursor:pointer;display:none}
section{display:none;padding:20px}
.container{background:#fff;padding:20px;border-radius:8px;max-width:400px;margin:auto}
input,textarea,button,select{width:100%;padding:10px;margin:5px 0}
button{background:#111;color:#fff;border:none;border-radius:5px;cursor:pointer}
button:hover{background:#333}
#msg{text-align:center;font-weight:bold;margin:10px}
#loader{display:none;text-align:center;margin:10px}
.spinner{border:6px solid #f3f3f3;border-top:6px solid orange;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:auto}
.task-buttons button{margin:5px 5px 5px 0}
.payment-item{background:#eee;padding:10px;margin:5px;border-radius:5px;}
.notification{background:green;color:white;padding:10px;margin:10px;border-radius:5px;}
</style>
</head>
<body>

<header>
<h3>BRONZE MONEY AGENCIES</h3>
<div id="balance">Balance: 0 Ksh</div>
</header>

<div id="msg"></div>
<div id="notify"></div>

<!-- Loader -->
<div id="loader"><div class="spinner"></div></div>

<!-- Landing -->
<section id="landing" style="display:block;text-align:center">
<h2>Welcome</h2>
<button onclick="show('login')">Get Started</button>
</section>

<!-- User Login -->
<section id="login">
<div class="container">
<h3>Login</h3>
<input id="loginPhone" placeholder="Phone">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="loginUser()">Login</button>
<p>New user?</p>
<button onclick="show('register')">Register</button>
</div>
</section>

<!-- Register -->
<section id="register">
<div class="container">
<h3>Register</h3>
<input id="regName" placeholder="Full Name">
<input id="regEmail" placeholder="Email">
<input id="regPhone" placeholder="Phone">
<input id="regPassword" type="password" placeholder="Password">
<input id="regReferral" placeholder="Referral Code (optional)">
<button onclick="registerUser()">Register</button>
</div>
</section>

<!-- Payment -->
<section id="payment">
<div class="container">
<h3>Activation Payment</h3>
<p>Pay 150 Ksh to: <b>+254703589646</b></p>
<textarea id="mpesaMessage" placeholder="Paste M-Pesa message"></textarea>
<button onclick="submitPayment()">Submit</button>
<p>After payment, admin will approve manually and you will be notified.</p>
</div>
</section>

<!-- Dashboard -->
<section id="dashboard">
<h3>Dashboard</h3>
<div class="task-buttons" style="display:flex;flex-wrap:wrap;">
  <button onclick="showTask('videos')">Videos</button>
  <button onclick="showTask('surveys')">Surveys</button>
  <button onclick="showTask('quiz')">Quiz</button>
  <button onclick="showTask('referral')">Referral</button>
  <button onclick="withdraw()">Withdraw</button>
</div>
<div id="taskContent" style="margin-top:20px;"></div>
</section>

<!-- Admin Login (separate) -->
<section id="adminLogin">
<div class="container">
<h3>Admin Login</h3>
<input id="adminUser" placeholder="Username">
<input id="adminPass" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
</div>
</section>

<!-- Admin Dashboard -->
<section id="adminDashboard">
<h3>Admin Dashboard</h3>

<div class="container">
<h4>Add Videos</h4>
<input id="newVideoLink" placeholder="Video link">
<button onclick="addVideo()">Add Video</button>

<h4>Pending Payments</h4>
<div id="pendingPayments"></div>
</div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0654D4iSF3E8isqCD_ujCwGT64xe4qeM",
  authDomain: "bronze-3c684.firebaseapp.com",
  projectId: "bronze-3c684",
  storageBucket: "bronze-3c684.appspot.com",
  messagingSenderId: "733916038073",
  appId: "1:733916038073:web:ef6de3d527247f5dc76c68"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUserId = null;
let isAdmin = false;

// Show section
window.show = function(id){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  if(id==='adminDashboard') loadPendingPayments();
}

// Messages
function showMsg(text,color="green"){
  const m = document.getElementById("msg");
  m.style.color = color;
  m.innerText = text;
  setTimeout(()=>{ m.innerText=""; },4000);
}

function showNotify(text){
  const n = document.getElementById("notify");
  n.innerHTML = `<div class="notification">${text}</div>`;
  setTimeout(()=>{ n.innerHTML=""; },5000);
}

// Loader
function showLoader(show=true){
  document.getElementById("loader").style.display = show?"block":"none";
}

// Register
window.registerUser = async function(){
  showLoader(true);
  let referralCode = regReferral.value.trim();
  let refUserId = null;
  if(referralCode){
    const snap = await getDocs(collection(db,"users"));
    snap.forEach(d=>{
      if(d.id.slice(0,6) === referralCode) refUserId = d.id;
    });
    if(refUserId){
      const refDoc = doc(db,"users",refUserId);
      const refSnap = await getDoc(refDoc);
      const refData = refSnap.data();
      const newBalance = (refData.balance || 0) + 50;
      await updateDoc(refDoc,{balance:newBalance});
      showMsg("Referring user earned 50 Ksh");
    } else {
      showMsg("Referral code invalid","red");
    }
  }

  const user = {
    name: regName.value,
    email: regEmail.value,
    phone: regPhone.value,
    password: regPassword.value,
    paid:false,
    balance:0,
    videos:[],
    surveys:[],
    quiz:[],
    referrals:[]
  };
  const docRef = await addDoc(collection(db,"users"), user);
  currentUserId = docRef.id;
  showLoader(false);
  showMsg("Registered successfully. Proceed to payment.");
  show('payment');
  listenPaymentApproval(); // start listening for approval
}

// Login
window.loginUser = async function(){
  showLoader(true);
  const phone = loginPhone.value;
  const pass = loginPassword.value;
  const snap = await getDocs(collection(db,"users"));
  let found=false;
  snap.forEach(d=>{
    const u = d.data();
    if(u.phone===phone && u.password===pass){
      currentUserId = d.id;
      found=true;
      if(u.paid){
        document.getElementById("balance").style.display="block";
        show('dashboard');
      } else {
        show('payment');
        listenPaymentApproval();
      }
    }
  });
  showLoader(false);
  if(!found) showMsg("Invalid login details","red");
}

// Submit payment
window.submitPayment = async function(){
  showLoader(true);
  await addDoc(collection(db,"payments"),{
    userId: currentUserId,
    message: mpesaMessage.value,
    approved:false
  });
  showLoader(false);
  showMsg("Payment sent. Admin will approve manually.");
  listenPaymentApproval();
}

// Admin login
window.adminLogin = async function(){
  if(adminUser.value==="admin" && adminPass.value==="admin123"){
    isAdmin = true;
    show('adminDashboard');
  } else showMsg("Invalid admin credentials","red");
}

// Add video manually
window.addVideo = async function(){
  const link = document.getElementById("newVideoLink").value;
  if(!link) return showMsg("Enter video link","red");
  await addDoc(collection(db,"videos"),{link});
  showMsg("Video added successfully");
}

// Withdraw button
window.withdraw = function(){
  alert("Minimum withdraw amount is 500 Ksh");
}

// Load pending payments
async function loadPendingPayments(){
  const container = document.getElementById("pendingPayments");
  container.innerHTML="Loading...";
  const snap = await getDocs(collection(db,"payments"));
  container.innerHTML="";
  snap.forEach(async p=>{
    const data = p.data();
    if(!data.approved){
      const userRef = doc(db,"users",data.userId);
      const userSnap = await getDoc(userRef);
      const u = userSnap.data();
      container.innerHTML += `<div class="payment-item">
        <p><b>User:</b> ${u.name}</p>
        <p><b>Phone:</b> ${u.phone}</p>
        <p><b>Message:</b> ${data.message}</p>
        <button onclick="approvePayment('${p.id}','${data.userId}')">Approve</button>
      </div>`;
    }
  });
}

// Approve payment manually
window.approvePayment = async function(paymentId,userId){
  const payRef = doc(db,"payments",paymentId);
  await updateDoc(payRef,{approved:true});
  const userRef = doc(db,"users",userId);
  await updateDoc(userRef,{paid:true});
  showMsg("Payment approved successfully");
}

// Listen for admin approval (real-time notification)
function listenPaymentApproval(){
  if(!currentUserId) return;
  const paymentsRef = collection(db,"payments");
  onSnapshot(paymentsRef,snap=>{
    snap.forEach(docSnap=>{
      const p = docSnap.data();
      if(p.userId===currentUserId && p.approved){
        showNotify("Your payment has been approved! You can access dashboard now.");
        document.getElementById("balance").style.display="block";
        show('dashboard');
      }
    });
  });
}

// Task functions (videos, surveys, quiz, referral) same as previous code
</script>
</body>
</html>
